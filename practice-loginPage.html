<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Card</title>
    <link rel="stylesheet" href="home.css">
    <style>
        :root {
            --blue-dark: #0f3d91;
            --blue-main: #2563eb;
            --blue-soft: #dbeafe;
            --blue-bg: #eff6ff;
            --white: #ffffff;
            --text-main: #12305f;
            --text-muted: #5b6f95;
            --border: #c9dafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #2563eb 100%);
            color: var(--text-main);
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 24px 60px rgba(15, 61, 145, 0.22);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--blue-soft);
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 31px;
            line-height: 1.15;
        }

        .subtitle,
        .signup-text {
            color: var(--text-muted);
        }

        .subtitle {
            margin-bottom: 28px;
            font-size: 15px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .login-form label {
            font-size: 14px;
            font-weight: 600;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #f8fbff;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-form input[type="email"]:focus,
        .login-form input[type="password"]:focus {
            border-color: var(--blue-main);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 6px 0 8px;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .checkbox input {
            accent-color: var(--blue-main);
        }

        a {
            color: var(--blue-main);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #2563eb 0%, #0f3d91 100%);
            color: var(--white);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
        }

        .signup-text {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="login-card">
            <p class="eyebrow">Welcome Back</p>
            <h1>Sign in to your account</h1>
            <p class="subtitle">Use your email and password to continue.</p>

            <form class="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com">

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password">

                <div class="form-row">
                    <label class="checkbox">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">Log In</button>
            </form>

            <p class="signup-text">Don't have an account? <a href="#">Create one</a></p>
        </section>
    </main>
</body>
</html>
