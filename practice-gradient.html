<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;
        }

        .battery {
            width: 300px;
            height: 40px;

            border: 3px solid white;
            border-radius: 10px;

            overflow: hidden;
        }

        .fill {
            width: 100%;
            height: 100%;

            background: linear-gradient(
                to right,
                red,
                yellow,
                green
            );
        }
    </style>
</head>

<body>

    <div class="battery">
        <div class="fill"></div>
    </div>

</body>
</html>
