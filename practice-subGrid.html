<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .root {
            --primary-color: grey;
        }

        .container1 {
            background-color: var(--primary-color);
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 5px solid black;
        }

        .container1 > div {
            font-size: 30px;
            outline: 2px dashed black;
        }

        .parent {
            --primary-color: red;
            display: grid;
            background-color: blue;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
        }

        .child {
            background-color: var(--primary-color);
            color: white;
            grid-column: 2/3;
            grid-row: 2/3;
        }

        /* #box1 {
            background-color: white;
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            z-index: 1;
        }
        
        #box6 {
            background-color: grey;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            z-index: 2;
        } */

    </style>
</head>
<body> 
    <div class="root">
        <div class="container1">
            <div class="parent">
                <div class="child">
                    1
                </div>
            </div>
            <!-- <div id="box2">2</div>
            <div id="box3">3</div>
            <div id="box4">4</div>
            <div id="box5">5</div>
            <div id="box6">6</div> -->
        </div>
    </div>
</body>
</html>
