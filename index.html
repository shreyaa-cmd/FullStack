<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Quiz Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-box">
    <h1>JS Quiz Arena</h1>

    <div id="quizArea">
      <div class="top-bar">
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div id="timer"></div>

      <h2 id="question"></h2>
      <div id="options"></div>
      <div id="explanation"></div>

      <div class="buttons">
        <button id="restartBtn" class="btn restart">Restart</button>
        <button id="reviewBtn" class="btn review">Review wrong answers</button>
        <button id="nextBtn" class="btn">Next</button>
      </div>
    </div>

    <div id="review"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
