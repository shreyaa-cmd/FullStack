<!DOCTYPE html>
<html>
<head>
    <title>Four Boxes</title>

    <style>
        body {
            margin: 0;
        }

        .container {
            width: 100%;
        }

        .box {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
        }

        .box1 {
            background-color: pink;
        }

        .box2 {
            background-color: yellow ;
        }

        .box3 {
            background-color: blue;
        }

        .box4 {
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">
            1
        </div>

        <div class="box box2">
            2
        </div>

        <div class="box box3">
            3
        </div>

        <div class="box box4">
            4
        </div>

    </div>

</body>
</html>
