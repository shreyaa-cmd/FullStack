<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        nav{
            height:70px;
            background:#2f2f2f;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:0 50px;
        }

        .logo{
            color:white;
            font-size:32px;
            font-weight:bold;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:20px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:18px;

            padding:10px 18px;
            border-radius:5px;

            transition:0.3s;
        }

        nav ul li a:hover{
            background:#007bff;
        }
    </style>
</head>
<body>
    <nav>
    <h1 class="logo">My Logo</h1>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>
</body>
</html>
